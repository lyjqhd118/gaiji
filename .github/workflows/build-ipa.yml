name: Build DeviceMatrix IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install macOS build tools
        run: brew install xcodegen ldid

      - name: Extract corrected source bundle
        run: |
          mkdir -p src
          unzip -q DeviceMatrix-cloud-source-v3.zip -d src

      - name: Pin Xcode 15 project format
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/project.yml")
          s = p.read_text()
          marker = "options:\n"
          s = s.replace(marker, marker + '  xcodeVersion: "15.3"\n  projectFormat: xcode15_3\n', 1)
          p.write_text(s)
          PY
          grep -n "projectFormat" src/project.yml

      - name: Build one-click IPA
        shell: bash
        run: |
          cd src
          chmod +x build-macos-one-click.sh
          ./build-macos-one-click.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceMatrix-one-click-ipa
          path: src/dist-one-click/DeviceMatrix-one-click.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeviceMatrix-build-evidence
          path: |
            src/dist-one-click/**
            src/build-one-click/**
            src/verification.json
          if-no-files-found: ignore
          retention-days: 7
