name: Build DeviceMatrix IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install macOS build tools
        run: brew install xcodegen ldid

      - name: Extract source bundle
        run: |
          mkdir -p src
          unzip -q DeviceMatrix-cloud-source.zip -d src

      - name: Build one-click IPA
        shell: bash
        run: |
          cd src
          chmod +x build-macos-one-click.sh
          ./build-macos-one-click.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceMatrix-one-click-ipa
          path: src/dist-one-click/DeviceMatrix-one-click.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeviceMatrix-build-evidence
          path: |
            src/dist-one-click/**
            src/build-one-click/**
            src/verification.json
          if-no-files-found: ignore
          retention-days: 7
