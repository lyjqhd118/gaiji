name: Build DeviceMatrix IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen ldid
      - run: |
          mkdir -p src
          unzip -q DeviceMatrix-cloud-source-v6.zip -d src
      - name: Fix generated source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("src/project.yml")
          s=p.read_text()
          s=s.replace("options:\n", 'options:\n  xcodeVersion: "15.3"\n  projectFormat: xcode15_3\n', 1)
          s=s.replace("      OTHER_LDFLAGS:\n        - -lcommonCrypto\n", "")
          p.write_text(s)
          p=Path("src/patch_vendor.py")
          s=p.read_text()
          s=s.replace("def patch_project", "def insert_after_once(t,m,a): return t.replace(m,m+a,1)\n\ndef patch_project", 1)
          for n in ["source_block","resource_block","group_block","resources_block"]:
              s=s.replace(n+" = insert_once(", n+" = insert_after_once(", 1)
          p.write_text(s)
          p=Path("src/vendor/TrollFools/TrollFools.xcodeproj/project.pbxproj")
          s=p.read_text()
          s,n=re.subn(r'shellScript = "PATH=.*?";', 'shellScript = "exit 0";', s, count=1)
          assert n==1
          p.write_text(s)
          p=Path("src/build-macos-one-click.sh")
          p.write_text(p.read_text().replace("\r\n", "\n").replace("\r", "\n"))
          PY
          grep -q insert_after_once src/patch_vendor.py
          grep -q projectFormat src/project.yml
          grep -q 'shellScript = "exit 0"' src/vendor/TrollFools/TrollFools.xcodeproj/project.pbxproj
      - name: Build one-click IPA
        shell: bash
        run: |
          cd src
          chmod +x build-macos-one-click.sh
          ./build-macos-one-click.sh
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceMatrix-one-click-ipa
          path: src/dist-one-click/DeviceMatrix-one-click.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeviceMatrix-build-evidence
          path: |
            src/dist-one-click/**
            src/build-one-click/**
            src/verification.json
          if-no-files-found: ignore
          retention-days: 7
